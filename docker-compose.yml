services:
  vibedeploy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/its-the-vibe/vibedeploy:latest
    pull_policy: always
    container_name: vibedeploy
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure:10
    environment:
      CONFIG_FILE: ${CONFIG_FILE:-/config/config.yaml}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN is required}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
