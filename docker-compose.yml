services:
  vibedeploy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/its-the-vibe/vibedeploy:latest
    pull_policy: always
    container_name: vibedeploy
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure:10
    environment:
      - REDIS_ADDR=${REDIS_ADDR:-host.docker.internal:6379}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - BASE_DIR=${BASE_DIR:-/app/repos}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_PUBSUB_CHANNEL=${REDIS_PUBSUB_CHANNEL:-slack-relay-reaction-added}
      - REDIS_LIST_NAME=${REDIS_LIST_NAME:-poppit-commands}
      - VIBEDEPLY_CONFIG=${VIBEDEPLY_CONFIG:-/config/vibeDeployConfig.yml}
    volumes:
      - ./vibeDeployConfig.yml:/config/vibeDeployConfig.yml:ro